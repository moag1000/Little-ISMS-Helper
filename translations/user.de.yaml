        user: 'Basis-Zugriff auf ISMS-Module. Kann Daten einsehen und eigene Aufgaben bearbeiten.'
        auditor: 'Erweiterte Leserechte für Audits und Reviews. Kann Audit-Ergebnisse dokumentieren und Compliance prüfen.'
        manager: 'Vollzugriff auf ISMS-Daten. Kann Reports erstellen, Workflows genehmigen und Compliance-Wizards nutzen. KEIN Zugriff auf Benutzerverwaltung.'
        admin: 'Organisations-Administrator. Verwaltet Benutzer, Rollen und Organisations-Einstellungen. Vollzugriff auf alle ISMS-Funktionen innerhalb seiner Organisation.'
        super_admin: 'System-Administrator. Organisationsübergreifender Zugriff, kann Benutzer wechseln (impersonieren) und globale Einstellungen verwalten.'
