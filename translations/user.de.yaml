        risk_manager: 'Risiko-Manager. Operative Sicht auf Risiko-Pipeline, Risk-Appetite-Monitoring und Mitigation-Effektivität. Schaltet das Risk-Manager-Dashboard frei.'
        dpo: 'Datenschutzbeauftragter (DPO). Sieht eigene zugewiesene DSAR-Vorgänge in Mein-Tag und das Compliance-Manager-Dashboard. KEIN See-All-Zugriff auf Datenbetroffenen-Anfragen.'
        compliance_manager: 'Head of GRC / Compliance-Manager. Framework-Coverage, Cross-Mapping, Audit-Plan und Findings im Blick. Schaltet das Compliance-Manager-Dashboard frei.'
        isb: 'Operativer Informationssicherheitsbeauftragter: Controls, Vorfälle, Audits. Schaltet das ISB-Dashboard frei.'
        bcm_officer: 'Business-Continuity-Manager: BC-Pläne, Krisenstab, Übungen, Geschäftsprozesse. Schaltet das BCM-Dashboard frei.'
