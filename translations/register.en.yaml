        dpo: Data protection officer (DPO)
        bcm_officer: Business continuity officer
    persona_duty:
        top_management: Holds overall responsibility for the ISMS, approves the risk management measures and oversees their implementation (ISO 27001 5.1, NIS-2 Art. 20).
        ciso: Owns the information security strategy and reports ISMS performance to top management (ISO 27001 5.3 b).
        isb: Runs the ISMS, ensures conformity with the standard and reports to top management (ISO 27001 5.3 a, b).
        risk_manager: Performs risk assessment and treatment and prepares risk acceptance (ISO 27001 6.1.2, 8.2).
        compliance_manager: Identifies legal, regulatory and contractual requirements and monitors compliance (A.5.31).
        dpo: Advises and monitors on data protection, contact point for the supervisory authority (GDPR Art. 39).
        bcm_officer: Plans, exercises and improves continuity preparedness and plans (A.5.29, A.5.30, ISO 22301).
