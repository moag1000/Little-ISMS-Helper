risk_approval_config:
    title: 'Risk criteria'
    subtitle: 'When a risk counts as medium, high or critical and who may accept it. Top management approves both (ISO 27001 6.1.2 a).'
    section:
        scale: 'Risk scale (score = likelihood × impact, 1–5 each)'
        thresholds: 'Approval levels for residual risks'
        last_change: 'Last change'
    field:
        band_critical: 'Critical from score'
        band_high: 'High from score'
        band_medium: 'Medium from score'
        probability_criteria: 'What the likelihood levels mean'
        impact_criteria: 'What the impact levels mean'
        automatic: 'Automatic acceptance up to score'
        manager: 'Risk management decides up to score'
        executive: 'Top management decides up to score'
        note: 'Rationale'
    help:
        band_critical: 'Default: 20. Applies to the matrix, filters, reports and KPIs.'
        band_high: 'Default: 12.'
        band_medium: 'Default: 6. Below it a risk is low.'
        probability_criteria: 'For example 1 = less than once in ten years, 5 = several times a year. The risk form shows the text during assessment.'
        impact_criteria: 'For example 5 = loss above € 1m or critical processes down for more than 24 hours.'
        automatic: 'Residual risks up to this score are accepted without further approval. Default: 3.'
        manager: 'Default: 7.'
        executive: 'Default: 25, the maximum of the 5×5 matrix.'
        note: 'For example a board resolution or an industry requirement.'
    criteria:
        probability_1: '1 – Very Unlikely'
        probability_2: '2 – Unlikely'
        probability_3: '3 – Possible'
        probability_4: '4 – Likely'
        probability_5: '5 – Very Likely'
        impact_1: '1 – Negligible'
        impact_2: '2 – Minor'
        impact_3: '3 – Moderate'
        impact_4: '4 – Major'
        impact_5: '5 – Catastrophic'
    approval:
        in_force: 'Top management approved these criteria on %date% (%name%). Risks up to the first approval level are accepted automatically.'
        missing: 'Top management has not approved these criteria. Until then risk management decides on low risks too (ISO 27001 6.1.2 a).'
        submit: 'Put forward for approval'
        change_hint: 'Changing the scale, a level meaning or an approval level ends the approval; put the criteria forward again afterwards.'
    hint:
        order: 'Ascending: automatic < risk management < top management.'
        band_order: 'Ascending: medium < high < critical. Every band keeps at least one score.'
    saved: 'Risk criteria saved.'
    updated_at: 'Updated at'
    updated_by: 'Updated by'
