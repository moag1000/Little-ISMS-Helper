guided_tour:
    action:
        restart: 'Restart tour'
        choose_role: 'Choose tour by role'

    role:
        auditor:
            label: 'Auditor tour'
        risk_owner:
            label: 'Risk-Owner tour'
        cm:
            label: 'Compliance-Manager tour'
        isb:
            label: 'ISB / Manager tour'
        ciso:
            label: 'CISO / Admin tour'
        junior:
            label: 'Starter tour (Junior)'
        mris:
            label: 'MRIS module tour'
        mapping:
            label: 'Mapping tour'
        board:
            label: 'Top management tour'
        risk_manager:
            label: 'Risk management tour'
        bcm:
            label: 'BCM tour'
        dpo:
            label: 'Data protection tour'

    banner:
        aria_label: 'Suggested onboarding tour'
        meta: '%steps% steps · approx. %min% min · skip anytime'
        start: 'Start tour'
        skip_forever: 'Don''t ask again'
        skip_forever_title: 'Mark as completed — banner will not reappear'

    # Junior (7 Steps)
    junior:
        meta:
            label: 'Newcomer orientation'
            description: 'The most important entry points for newcomers — especially helpful with a QM background.'
        step:
            next_control:
                title: 'The next control'
                body: 'The SoA filtered to controls not started yet: this is where you find your next task.'
            welcome:
                title: Welcome to the tool
                body: 'In 5 minutes I''ll show you the key landing points. You can skip with Esc anytime — the tour stays accessible from the user menu (top right).'
            mega_menu:
                title: 'Navigation via the mega menu'
                body: 'The main navigation groups all modules into seven categories: Dashboard, ISMS Core, Assets & Risk, BCM, Privacy, Operations, Compliance, Administration. Hover opens, click navigates.'
            kpis:
                title: 'Key KPIs at a glance'
                body: 'Your current status at a glance: risk heatmap, framework load state, FTE savings from reuse. Colors indicate action required — red = now, yellow = soon, green = fine.'
            iso9001_bridge:
                title: 'For newcomers with a QM background'
                body: "Familiar with ISO 9001? Then you already know a lot. In the Help menu under \"9001 → 27001 bridge\" you'll find a conceptual translation — CAPA ↔ Risk treatment, Process map ↔ SoA, Management review ↔ Management evaluation."
            command_palette:
                title: 'Search instead of clicking (⌘K / Ctrl+K)'
                body: '⌘K, ⌘P or "/" open one window for records, pages and commands. "?" lists all keyboard shortcuts.'
            first_asset:
                title: 'Create your first asset'
                body: 'Assets (IT systems, information, processes) are the foundation — risks, controls and compliance build on them. Create one and record the protection needs (confidentiality / integrity / availability on a 1–5 scale).'
            shortcuts:
                title: 'Help and implementation progress'
                body: "In the menu under \"Help & Resources\" you'll find the ISO 9001 → 27001 bridge, the glossary and all keyboard shortcuts. On the dashboard, the implementation progress shows your status across 7 phases and what to tackle next. Tip: press \"?\" for the shortcut overview."

    # Compliance-Manager (5 Steps)
    cm:
        meta:
            label: 'Compliance Manager orientation'
            description: 'Framework portfolio, reuse KPIs, mapping leverage — everything GRC day-to-day needs.'
        step:
            welcome:
                title: Quick tour for compliance managers
                body: 'Three minutes, five stops — the levers for framework portfolio, data reuse and mapping efficiency. You know ISMS jargon, I''ll skip asset/risk basics.'
            framework_dashboard:
                title: 'Framework dashboard'
                body: 'Under Compliance → Framework dashboard you see which of the 23 frameworks are loaded, which requirements are met, where gaps exist. This is your portfolio radar.'
            mapping_hub:
                title: 'Mapping hub as junior entry point'
                body: 'Compliance → Mapping hub bundles Wizard (4-step creation), Seed catalogs (8 ready-made cross-framework packs), Quality score, Transitive Coverage. No more direct dive into the 1,800-entry dropdowns.'
            reuse_hub:
                title: 'Data-Reuse Hub — the board story'
                body: '/reuse shows FTE-days saved through mapping inheritance plus top documents/suppliers. That''s your euro figure for the board — and the trend chart on the portfolio page answers "is it getting better?".'
            seed_review:
                title: 'Seed review queue for audit evidence'
                body: 'Seeds come with verified_by=app:seed-*. Under Mapping → Seed Review Queue you can go through all machine-created mappings once and approve — audit-relevant when the auditor asks "who made this?".'

    # CISO (4 Steps)
    ciso:
        meta:
            label: 'CISO orientation'
            description: 'Board metrics in 90 seconds — delegation to CM/ISB runs through the modules.'
        step:
            welcome:
                title: Quick tour for the CISO
                body: '90 seconds, four stops. No SoA detail, no button explanations — the three numbers for your next board meeting plus the delegation path.'
            board_export:
                title: 'Board one-pager export'
                body: 'Management reports → Board one-pager. One click, one PDF: ISMS health score, top-5 risks, framework traffic light, last critical incidents. Briefing for the next session.'
            health_score:
                title: 'ISMS health score on the dashboard'
                body: 'At the top of /dashboard you see the aggregated health score — weighted mix of coverage, risk level, incident trend. Color indicates action required.'
            framework_matrix:
                title: 'Framework traffic-light matrix'
                body: 'Under Compliance → Framework dashboard you see which frameworks are green/yellow/red. Click a red entry → directly to the action list that your CM/ISB works on.'

    # ISB (5 Steps)
    isb:
        meta:
            label: 'ISB orientation'
            description: 'Operational tools: SoA, risk register, incidents, workflows, audit log, My Day, context, registers, duty calendar and suggestions.'
        step:
            my_day:
                title: 'My Day'
                body: 'Everything waiting for you: approvals, deadlines, reviews and reporting duties from all modules in one place.'
            context:
                title: 'Context of the organisation'
                body: 'ISO 27001 4.1–4.3: you maintain internal and external issues, scope and interfaces here.'
            registers:
                title: 'Registers'
                body: 'Roles, communication, legal register and further registers under 4.1–7.4, with suggestions from existing data.'
            duties:
                title: 'Duty calendar'
                body: 'Recurring norm duties without a date on a record, such as the yearly SoA review.'
            suggestions:
                title: 'Suggestions'
                body: 'What the tool derives from your data, you decide here: accept or dismiss.'
            welcome:
                title: Quick tour for the ISB
                body: 'Five minutes, six operational stops — SoA, risk register, incidents, workflows, audit log, command palette. Your core tools for daily work.'
            soa:
                title: 'SoA with bulk edit'
                body: '/soa lists all 93 Annex A controls plus module-specific ones. The bulk edit toolbar allows N/A marking with mandatory justification for multiple controls at once — one filter click is enough.'
            risk:
                title: 'Risk register — your central working tool'
                body: '/risk is the heart of the ISMS (ISO 27001 Cl. 6.1.2). Each risk = threat × vulnerability, scored by likelihood × impact. The live heatmap shows severity instantly; link assets, controls and treatment plans — captured once, referenced everywhere.'
            incidents:
                title: 'Incidents with status filter + 72h timer'
                body: '/incident shows open incidents with severity filter. For GDPR data breaches the 72h timer (Art. 33) runs visibly — the workflow notifies automatically.'
            workflows:
                title: 'Review workflow instances'
                body: '/workflow/instances shows all running approvals, incident escalations, document reviews. Auto-progression: when field X is filled, the workflow moves to the next step.'
            audit_log:
                title: 'Tamper-evident audit log'
                body: '/admin/audit-log has an HMAC-SHA256 chain — every entry can be verified. app:audit-log:verify on the command line confirms integrity. NIS2 Art. 21.2 compliant.'

    # Risk-Owner (2 Steps)
    risk_owner:
        meta:
            label: 'Risk Owner orientation'
            description: 'Your risks, your confirmation — enough to get started.'
        step:
            my_day:
                title: 'My Day'
                body: 'Due assessments and treatment steps of your risks are listed here, also in the daily digest mail.'
            welcome:
                title: Quick tour for risk owners
                body: 'One minute, two stops. You''re business, not security expert — my tour is intentionally short.'
            my_risks:
                title: 'View + confirm my risks'
                body: '/risk?owner=me filters to your risks. Open one: on the left the description from ISB/CM, on the right your feedback field "confirm or request change". The ISB/CM takes it from there.'

    # Module-bound add-on steps (junior + isb only, only when module active)
    modules:
        bsi:
            title: 'BSI IT-Grundschutz (optional, because module is active)'
            body: 'Under /bsi-grundschutz-check you see the protection-level filter (Basis / Standard / Kern) plus requirement types (MUSS / SOLLTE / KANN). If your tenant only needs Basis protection, this significantly reduces SoA effort.'
        gdpr:
            title: 'Privacy (optional, because GDPR module is active)'
            body: 'Three areas under "Privacy & GDPR": processing activities (Art. 30), data protection impact assessment (Art. 35 DPIA) and data breaches (Art. 33 with 72h timer). The timer runs automatically and notifies the ISB.'
        bcm:
            title: 'Business continuity (optional, because BCM module is active)'
            body: 'Four stops in the BCM flow: capture business processes → perform BIA (Business Impact Analysis) → create BC plan → schedule BC exercise. All accessible via the "Business Continuity" menu. RTO/RPO are explained as tooltips on the respective fields.'

    # MRIS module tour (8 steps, topic-based — not role-based)
    # Goal: Junior ISB walkthrough of the Mythos-Resilience-Indicator System
    # (MRIS v1.5 by Peddi 2026, CC BY 4.0). Short, active, with ISO-9001 bridges.
    mris:
        meta:
            label: 'MRIS module tour'
            description: 'Eight stops through the Mythos-Resilience-Indicator System — from the SoA column through MHC maturity to the glossary. Source: Peddi 2026, CC BY 4.0.'
        step:
            soa_column:
                title: 'New MRIS column in the SoA'
                body: 'The SoA has a new "MRIS" column. It classifies each ISO 27001 Annex A control by Mythos resilience: solid, degraded, pure friction, not affected. Filter at the top right. Source: Peddi 2026 (CC BY 4.0).'
            reibung_warning:
                title: 'Click on a "Pure Friction" control'
                body: 'Open a control with MRIS status "pure friction". The red warning explains: this control does not help against the Mythos — you need a flanking MHC. Like a 9001 CAPA addressing the symptom, not the root cause.'
            mhc_maturity:
                title: 'MHC detail with maturity'
                body: 'On a Mythos-Hardening-Control page (e.g. MHC-01 PQC) you see the maturity table: initial → defined → managed → measured → optimized. Maintain current + target, the tool shows the gap. Analogous to maturity models from 9001.'
            kpi_score:
                title: 'MRIS KPI overview'
                body: 'At /mris/kpis you see 8 KPIs from the MHCs plus the aggregated score on the left. Auto KPIs are computed from tool data, manual ones you maintain yourself — like an audit programme tracker in 9001.'
            mri_disclaimer:
                title: 'Mythos-Resilience-Indicator (MRI) — note the disclaimer'
                body: 'The yellow box below the score: the MRI is tool-internal, not audit evidence. It helps you spot trends — auditors want to see the standard evidence themselves. Like an internal QM index in 9001.'
            ai_agents:
                title: 'AI agent inventory'
                body: 'At /ai-agents you maintain autonomous AI agents (e.g. copilots, auto-decisions) including EU AI Act risk class. Mandatory for CRA + AI Act from 2026 — and a prerequisite for MHC-13.'
            wizards:
                title: 'Wizards menu on the KPI page'
                body: 'Three wizards walk you step-by-step through typical MRIS tasks: pure-friction routine, collect maturity evidence, set AI risk class. Like a guided 9001 audit checklist, just click-instead-of-paper.'
            glossar:
                title: 'MRIS glossary as a reference'
                body: 'At /mris/glossar you find all MRIS terms with definition, 9001 bridge and standard reference. Ideal for Junior ISB with a QMB background. Tour finished — you can restart it anytime under Help → MRIS tour.'

    # Auditor (3 Steps)
    auditor:
        meta:
            label: 'Auditor orientation'
            description: 'Read-only scope. Three bookmarks are enough for audit runs.'
        step:
            welcome:
                title: Quick tour for auditors
                body: 'Your account is read-only. Two minutes, four stops — the bookmarks for your audit run.'
            documents:
                title: 'Documents + policies'
                body: '/document lists all policies, process documents, evidence. Filter by framework (ISO 27001, NIS2, DORA etc.) narrows to your audit scope. Export as PDF or audit-package ZIP at the bottom right.'
            audit_log:
                title: 'Audit log with integrity check'
                body: '/admin/audit-log — tamper-evident HMAC-SHA256 chain. Click "Verify" to validate each entry. This is your chain of custody for ISO 27001 Clause 9.2 and NIS2 Art. 21.2.'
            audit_package:
                title: 'Download the audit package yourself'
                body: 'Under Reports → Audit package you download the certification bundle and the audit package per framework yourself, as a ZIP with checksum. Read-only, no data changes.'

    # Top management (4 steps) — ISO 27001 5.1, 9.3; NIS-2 Art. 20
    board:
        meta:
            label: 'Top management orientation'
            description: 'Situation, report, management review, decisions and your approvals — five stops.'
        step:
            decisions:
                title: 'Management decisions'
                body: 'What the norm asks of you: approve policy, risk criteria, SoA and objectives. Open proposals and expiring approvals are listed here.'
            welcome:
                title: 'The status at a glance'
                body: 'The top management dashboard shows the traffic lights for security, risks and compliance with their trend. Red means a decision of yours is needed.'
            one_pager:
                title: 'Board one-pager'
                body: 'Under Management reports you download the one-pager as PDF for the next meeting yourself, without going through the ISO.'
            management_review:
                title: 'Management review'
                body: 'ISO 27001 9.3 requires the review by top management. Here you see dates, inputs and decisions of the reviews.'
            my_day:
                title: 'Your approvals'
                body: 'What waits for your decision is in My Day: approvals, risk acceptances and four-eyes requests.'

    # Mapping topic tour (10 steps) — for junior ISOs with an IT / ISO 9001 background
    risk_manager:
        meta:
            label: 'Introduction for risk management'
            description: 'Criteria, register, treatment, acceptance and the yearly duties — six stops.'
        step:
            welcome:
                title: 'Your risk cockpit'
                body: 'The dashboard shows exposure, open treatments and acceptances waiting for a decision.'
            criteria:
                title: 'Criteria first'
                body: 'ISO 27001 6.1.2 a asks for criteria for assessment and acceptance. You set risk appetite and thresholds here, top management approves them.'
            register:
                title: 'The risk register'
                body: 'Every risk with owner, assessment and treatment option (6.1.2 c–e). New risks also come from assets, incidents and vulnerabilities.'
            treatment:
                title: 'Treatment plans'
                body: '6.1.3 and 8.3: measures, dates and owners. Due steps appear in My Day of the people responsible.'
            acceptance:
                title: 'Acceptance by top management'
                body: 'Residual risks above the threshold are accepted by top management only. The decision is kept in the management decision register.'
            duties:
                title: 'Recurring duties'
                body: 'The yearly review of criteria and register is in the duty calendar, with evidence when you mark it done.'

    bcm:
        meta:
            label: 'Introduction for BCM'
            description: 'BIA, plans, exercises and crisis team — five stops following ISO 22301.'
        step:
            welcome:
                title: 'Your BCM cockpit'
                body: 'BIA coverage, active plans and exercises this year from the same KPIs as everywhere, plus what is waiting for you.'
            bia:
                title: 'Business processes and BIA'
                body: 'ISO 22301 8.2.2: criticality, RTO and RPO per process. Processes without BIA lower the coverage.'
            plans:
                title: 'Continuity plans'
                body: '8.4: one plan per critical process, approved and reviewed.'
            exercises:
                title: 'Exercises'
                body: '8.5: planned and completed exercises with result and lessons learned.'
            crisis_team:
                title: 'Crisis team'
                body: 'Members, deputies and training status of the crisis team.'

    dpo:
        meta:
            label: 'Introduction for data protection'
            description: 'Records, DPIA, data breaches and data subject requests — five stops following the GDPR.'
        step:
            welcome:
                title: 'Your data protection cockpit'
                body: 'Open requests, breaches with a running deadline and due reviews at a glance.'
            records:
                title: 'Records of processing'
                body: 'Art. 30: every processing activity with purpose, legal basis, recipients and retention.'
            dpia:
                title: 'Data protection impact assessment'
                body: 'Art. 35: for high-risk processing, with consultation under Art. 36 where needed.'
            breaches:
                title: 'Data breaches'
                body: 'Art. 33/34: pre-check, assessment and notification within 72 hours. The clock starts when you become aware.'
            requests:
                title: 'Data subject requests'
                body: 'Art. 15–22: access, erasure, rectification within one month, with a reminder before the deadline.'

    mapping:
        meta:
            label: 'Mapping tour'
            description: 'Ten stops explaining the mapping concept from scratch: bridge between frameworks, data reuse / inheritance, inheritance queue, coverage, confidence vs. MQS and lifecycle.'
        step:
            what_is_mapping:
                title: 'What is a mapping?'
                body: 'A mapping is a bridge: it links a requirement from framework A (e.g. ISO 27001) to one from framework B (e.g. NIS2). Instead of working through every standard separately, the mapping says "these two mean the same thing". ISO 9001 analogy: like a cross-reference between two process descriptions that demand the same measure.'
            why_reuse:
                title: 'Why? Data reuse & inheritance'
                body: 'The benefit: fulfil the requirement in A once and, through the mapping, it automatically counts for B as well (inheritance / data reuse). You maintain the evidence once instead of many times. ISO 9001 analogy: one CAPA that covers several processes — one record, multiple ticks.'
            inheritance_suggest:
                title: 'Confirm inheritance suggestions'
                body: 'When you load a new framework, the system automatically proposes fulfilment values from frameworks you already use. You confirm these suggestions once in the inheritance queue — do the work once, let it count many times. The link to the queue is available in the Data-Reuse Hub.'
            read_coverage:
                title: 'Reading coverage'
                body: 'Coverage shows what percentage of framework X is already covered by your fulfilled controls — e.g. "87%". The missing 13% is your to-do list: unmapped or not-yet-fulfilled requirements. So the % picture is not an end in itself but your backlog. (ISO 27001 Cl. 6.1.3)'
            quality:
                title: 'Understanding quality: confidence vs. MQS'
                body: 'Two numbers, two questions: Confidence says "how sure is the content of the mapping link?". MQS (Mapping Quality Score) says "how well evidenced and maintained is the link?" — that is provenance, methodology and lifecycle. High confidence with low MQS means: plausible in content, but still poorly documented.'
            lifecycle:
                title: 'Lifecycle: draft vs. published'
                body: 'A mapping in "draft" status is not yet reviewed and does NOT count towards coverage. Only after the review gate — i.e. "published" — does it become operational. Lots of drafts? That is your review pile. ISO 9001 analogy: a document in draft only applies once approved.'
            seeds:
                title: 'Seed review: checking machine mappings'
                body: 'Under Seed Review you find all machine-generated mappings (verified_by=app:seed-*). Work through these once and approve or reject — relevant when an auditor asks "who created this mapping?".'
            gaps:
                title: 'Closing gaps'
                body: 'The Gaps page shows all requirements that do not yet have a valid mapping. This is your action plan: at a glance you see where connections are missing and which frameworks are affected.'
            cross_framework:
                title: 'Cross-framework usage'
                body: 'The cross-framework view shows how your mapping network connects frameworks — which requirements are shared across multiple standards and what the transitivity chains look like. Here you see the value of your entire mapping effort.'
            where_used:
                title: 'Where do I use it?'
                body: 'Three places: the coverage / transitive matrix (the big % picture), the inheritance suggestions (data-reuse hub: "this evidence fits here too") and the quality dashboard (reviews, confidence/MQS, gaps). Tour finished — you can restart it any time via "Start tour" on the mapping page.'
