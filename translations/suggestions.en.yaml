            justification: SoA justification from links
    kind_help:
        asset:
            protection_need: Dependencies (maximum principle) and the BIA raise the protection need.
        risk:
            residual: Implemented and effective controls lower the likelihood.
            treatment_complete: All controls of the plan are implemented.
            after_incident: An incident made the risk occur.
            from_vulnerability: Open vulnerability from CVSS 7 without a risk.
        treatment_plan:
            progress: Share of implemented controls.
        control:
            effectiveness: From tests, incidents and protected assets.
            requirement_link: Text similarity between control and requirement.
        register:
            issue_external: From the external issues in the context.
            issue_internal: From the internal issues in the context.
            legal_requirement: From frameworks, interested parties and context.
            scope_interface: From critical suppliers.
            role: From the holders of the persona roles.
            competence: Default competences of the roles in the role register.
            opportunity: From the last management review.
        legacy_owner:
            match: Free-text owners match a person.
        compliance:
            inheritance: A fulfilled requirement covers a mapped one.
        ai:
            risk_from_incident: Writes a risk for incidents of the last 90 days without a linked risk.
            soa_justification: Writes a justification for applicable controls without one (ISO 27001 6.1.3 d).
            corrective_action: Writes a corrective action for open findings without one (ISO 27001 10.2).
            incident_report: Writes the text of the next open NIS-2 or DORA report (Art. 23 (4), Art. 19).
            breach_notification: Writes the empty parts of the notification to the supervisory authority (GDPR Art. 33 (3) a, c, d).
            dsr_response: Writes the answer to open data subject requests without one (GDPR Art. 12, 15–22).
            board_summary: Writes the summary of a management review with at least three inputs (ISO 27001 9.3).
            nonconformity_statement: Turns notes on a nonconformity into the audit report statement (ISO 19011 6.4.8).
            questionnaire_evaluation: Evaluates answered supplier questionnaires (ISO 27001 A.5.19–5.22, NIS-2 Art. 21 (2) d).
        soa:
            justification: Justification from the risks treated and the requirements of other frameworks (ISO 27001 6.1.3 d).
    text:
        dimension:
            confidentiality: Confidentiality
            integrity: Integrity
            availability: Availability
        effectiveness:
            effective: effective
            partially_effective: partially effective
            ineffective: ineffective
        asset_protection:
            title: 'Raise protection need of %asset%'
            change: '%dimension% %from% → %to% (%reason%)'
            reason_dependency: 'inherits from %asset%'
            reason_bia: 'BIA %process%, RTO %rto% h'
        risk_residual:
            title: 'Enter residual risk for %risk%'
            rationale: 'Inherent %inherent%, residual %from% → %to%. %basis%'
            no_controls: No implemented control, residual risk equals inherent risk.
            controls: 'Implemented: %implemented%. Effective: %effective%.'
        risk_treatment_complete:
            title: 'Complete treatment of %risk%'
            rationale: 'All controls are implemented: %controls%.'
        treatment_plan_progress:
            title: 'Update progress of %plan%'
            rationale: '%done% of %total% controls implemented, progress %from% % → %to% %.'
        control_effectiveness:
            title: 'Rate effectiveness of %control%'
            rationale: 'Score %score% of 100 → %rating%. Last test %tested%, %incidents% incidents since the test, %assets% protected assets.'
        risk_after_incident:
            title: '%risk% occurred, raise likelihood'
            rationale: 'Incident %incident% was closed on %closed%. Likelihood %from% → %to%.'
        risk_from_vulnerability:
            title: 'Create risk for %cve%'
            rationale: 'CVSS %cvss%, affected: %asset%. Proposed likelihood %probability%, impact %impact%.'
            risk_title: '%cve%: %title%'
        register:
            title: '%register%: adopt %title%'
            rationale: 'Proposed from: %source%. Standard: %norm%.'
        legacy_owner:
            title: 'Assign owners for %record%'
            rationale: 'Free text "%legacy%" matches %match%.'
        inheritance:
            title: 'Take over %target% from %source%: %title%'
            rationale: '%source% is fulfilled, mapping confidence %confidence%. Proposed %percent% % fulfilment for %target%.'
            comment: 'Taken over from %source% (mapping confidence %confidence%), reviewed for %target%.'
        requirement_link:
            title: '%control% covers %requirement%'
            rationale: '"%title%", text similarity %pct% %.'
        ai_risk:
            title: 'Create risk: %risk%'
            rationale: 'From incident %incident%. Threat: %threat%. Vulnerability: %vulnerability%. Likelihood %probability%, impact %impact%.'
        ai_soa:
            title: 'Justification for %control%'
            rationale: 'Related risks: %risks%. %reasoning%'
        ai_capa:
            title: 'Corrective action: %action%'
            rationale: 'For finding %finding%. Cause: %cause%. %reasoning%'
        ai_incident_report:
            title: 'Report text for %incident%'
            rationale: 'Next report due by %deadline%. Marking it as reported stays with you. %reasoning%'
        ai_breach:
            title: 'Art. 33 notification for %breach%'
            rationale: 'Notification deadline %deadline%. Only empty fields are filled. %reasoning%'
            nature: Nature of the breach
            consequences: Likely consequences
            measures: Measures taken or proposed
        ai_dsr:
            title: 'Answer to %request%'
            rationale: '%article%, deadline %deadline%. Sending and closing stay with you. %reasoning%'
        ai_board:
            title: 'Summary for top management: %review%'
            rationale: 'From %inputs% inputs of the management review. Deciding stays with top management (9.3.3). %reasoning%'
        ai_nc:
            title: 'Nonconformity statement for %finding%'
            rationale: 'Requirement: %clause%. Replaces the notes, evidence only if empty. %reasoning%'
        ai_questionnaire:
            title: 'Evaluation of %questionnaire% from %supplier%'
            rationale: '%answers% of %questions% questions answered, %gaps% gaps. The rating stays with you. %reasoning%'
            heading: 'Evaluation %questionnaire% (answered %date%):'
        soa_rule:
            rationale: 'From %risks% linked risks and %requirements% requirements of other frameworks.'
            risks: 'Applicable because the control treats these risks: %risks%.'
            requirements: 'Required by: %requirements%.'
            excluded: Not applicable, no risk in the register is treated by this control and no requirement of an active framework asks for it.
            status:
                not_started: Implementation not started.
                planned: Implementation planned.
                in_progress: Implementation in progress.
                implemented: Implemented.
                verified: Implemented and verified.
