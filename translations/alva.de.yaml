alva_hint:
    kritis_operator_readiness:
        title: 'KRITIS-Pflicht: IT-Sicherheitsleitlinie fehlt'
        body: '%tenant_name% ist KRITIS-Betreiber ohne genehmigte IT-Sicherheitsleitlinie. BSIG § 8a / KRITIS-Dachgesetz fordern sie als Mindestnachweis.'
        cta_label: 'BSI-Wizard starten'
        dismiss_label: 'Nicht jetzt'
    konzern_ciso_drift_alert:
        title: 'Tochter weicht von Konzern-Vorgabe ab'
        body: '%affected_count% Tochter-Einstellungen weichen vom Konzern %konzern_name% ab, z. B. „%first_setting_key%“. Siehe „Abweichungen“.'
        cta_label: 'Abweichungen öffnen'
        dismiss_label: 'Später erinnern'
    open_finding_reference:
        title: 'Audit-Finding ohne Re-Run-Abschluss'
        body: 'Wizard-Run mit Finding „%finding_ref%“ seit %age_days% Tagen offen (Schwelle: %threshold_days%). Re-Run abschließen oder begründen.'
        cta_label: 'Targeted Re-Run starten'
        dismiss_label: 'Nicht jetzt'
    document_split_needed:
        title: 'Legacy-Dokument noch nicht aufgeteilt'
        body: 'Topic „%topic%“: Entscheidung „split_to_topics“ offen (%count% gesamt). Auf merge_into_topic/replace umstellen oder Targeted-Re-Run starten.'
        cta_label: 'Bestandsaufnahme öffnen'
        dismiss_label: 'Später erinnern'
    training_coverage_gap:
        title: 'Policy-Bestätigungsquote unter Schwelle'
        body: '„%document_title%“ erst zu %coverage_percent% % bestätigt (Ziel: %threshold_percent% %). ISO 27001 Cl. 7.3: Bestätigungen anstoßen.'
        cta_label: 'Bestätigungs-Inbox öffnen'
        dismiss_label: 'Später erinnern'
    bcm_exercise_due:
        title: 'BCM-Übung steht in %days% Tagen an'
        body: 'BCM-Übung „%exercise_name%“ (%exercise_type%) in %days% Tagen. ISO 22301 Cl. 8.6: Teilnehmer einladen, Szenario finalisieren.'
        cta_label: 'Übung öffnen'
        dismiss_label: 'Später erinnern'
    bcm_exercise_overdue:
        title: 'BCM-Übung überfällig'
        body: 'BCM-Übung „%exercise_name%“ (%exercise_type%) seit %days% Tagen überfällig. ISO 22301 Cl. 8.6: mit Begründung verschieben oder absagen.'
        cta_label: 'Übung öffnen'
        dismiss_label: 'Nicht jetzt'
    lifecycle:
        stuck_in_status:
            title: 'Lifecycle-Übergänge feststeckend'
            body: '%count% Dokument(e) seit über %days% Tagen in einem nicht-terminalen Status (Entwurf, In Prüfung …). Nächsten Schritt einleiten.'
            action: 'Dokumente anzeigen'
    # P-19 — Form-Step-Inline-Hint Pattern. Inline-Hinweise, die WÄHREND des
    # Form-Ausfüllens (vor Speichern) erscheinen — neben dem auslösenden Feld.
    # Kein 72h-SLA, kein Tier-1, keine Dismissal-Persistenz: das sind reine
    # „Auf-was-du-dich-mit-Speichern-einlässt"-FYIs.
    form:
        incident_data_breach:
            title: 'Datenpanne-Akte wird beim Speichern automatisch angelegt'
            body: Beim Speichern entsteht eine DataBreach-Akte mit Vorbefüllung. Der DSGVO-Art.-33-Countdown (72 h) startet ab Erkennung — früh planen.
            action: 'Wie die 72-h-Frist abläuft'
        risk_critical_severity:
            title: 'Kritisches Risiko (Score %score%) — Board-Approval prüfen'
            body: 'Risiko-Score %score% ist kritisch. ISO 27001 Cl. 5.3 + 6.1.3 f: Risk-Owner mit Entscheidungskompetenz, meist C-Level (ROLE_CISO).'
            action: 'Risk-Owner-Konvention öffnen'
        risk_score_explainer:
            title: 'Risikowert = %probability% × %impact% = %score%'
            body: 'Wahrscheinlichkeit (%probability%) × Auswirkung (%impact%) = Risikowert %score% (ISO 27005). Höher = dringender. Heatmap zeigt es.'
        # ── Form-Coverage-Expansion (P-19 follow-up) ─────────────────────────
        # Inline-Hints für 9 weitere FormTypes, alle pre-save Warnungen.
        asset_critical_confidentiality:
            title: 'Kritische Vertraulichkeit — verschärfte Owner-Pflichten'
            body: 'Vertraulichkeit 5 = „kritisch“. ISO 27001 A.5.17 + BSI ORP.4.A11: MFA für den Owner, jährlicher Access-Review (A.5.15). Jetzt planen.'
            action: 'Access-Control-Konvention öffnen'
        asset_retired_status:
            title: 'End-of-Life — Disposal-Evidence erforderlich'
            body: '„retired“/„disposed“ erfordert dokumentierte sichere Entsorgung (ISO 27001 A.7.14, BSI CON.6). Bei kritischem Prozess: Ersatz im BC-Plan.'
            action: 'Disposal-Checkliste öffnen'
        business_process_recovery_chain_imbalance:
            title: 'RPO (%rpo% h) > RTO/2 (%rto% h) — Backup-Frequenz prüfen'
            body: 'RPO von %rpo% h übersteigt die Hälfte der RTO von %rto% h: Backups liefern vor Wiederanlauf keinen konsistenten Stand (ISO 22301 Cl. 8.2.2).'
            action: 'BIA-Leitfaden öffnen'
        bcp_stale_exercise:
            title: 'BC-Plan länger als 12 Monate nicht geübt'
            body: 'ISO 22301 Cl. 8.5: Übungen mindestens jährlich. BC-Plan ohne Übung in 12 Monaten = Major-NC-Kandidat. Übung terminieren, Datum nachtragen.'
            action: 'BCM-Übungs-Doku öffnen'
        bcp_no_crisis_team:
            title: 'Kein Krisenteam definiert — wer aktiviert den Plan?'
            body: Weder responseTeamMembers noch crisisTeams gesetzt. Ohne aktivierungsbefugtes Team unbrauchbar — ISO 22301 §8.5.3 verlangt benannte Rollen.
            action: 'Krisenteam-Konvention öffnen'
        incident_high_severity_no_root_cause:
            title: 'Hochsicherheits-Vorfall ohne Root-Cause-Analyse'
            body: 'Severity %severity%, Status %status%, ohne Ursachenanalyse. ISO 27001 Cl. 10.1 + 10.2 verlangen sie vor Closure, sonst unwirksam.'
            action: 'Root-Cause-Template öffnen'
        incident_nis2_early_warning_pending:
            title: 'NIS2 24h-Frühwarnung läuft — earlyWarningReportedAt setzen'
            body: 'NIS2 Art. 23 (4)(a): Frühwarnung binnen 24 Stunden nach Kenntnisnahme. earlyWarningReportedAt ist leer — Behörden-Kontakt vorbereiten.'
            action: 'NIS2-Meldepflicht-Guide öffnen'
        document_review_interval_too_long:
            title: 'Review-Intervall (%months% Monate) länger als 24 Monate'
            body: 'Baseline für ISO 27001 A.5.32 ist ein jährlicher Review. Intervalle > 24 Monate brauchen eine risikobasierte Begründung. Intervall kürzen.'
            action: 'Review-Cadence-Konvention öffnen'
        document_acknowledgement_without_audience:
            title: 'Acknowledgement-Pflicht ohne definierte Audience'
            body: 'Ohne acknowledgementAudience geht die Bestätigung an alle Nutzer — selten gewollt (ISO 27001 A.6.3: rollenbasiert). Empfängergruppe wählen.'
            action: 'Audience-Picker öffnen'
        training_mandatory_without_audience:
            title: 'Pflicht-Training ohne definierte Audience'
            body: mandatory=true ohne targetAudience/Teilnehmer verhindert Auto-Zuweisung und Coverage-Auswertung (ISO 27001 A.6.3). Audience definieren.
            action: 'Audience-Konvention öffnen'
        training_mandatory_without_materials:
            title: 'Pflicht-Training ohne Materialien'
            body: 'Pflichttraining ohne materialFiles/Materialbeschreibung ist nicht durchführbar. ISO 27001 A.6.3: Awareness-Inhalte als Evidence hinterlegen.'
            action: 'Training-Material-Template öffnen'
        corrective_action_effectiveness_review_overdue:
            title: 'Wirksamkeitsprüfung überfällig'
            body: 'effectivenessReviewDate liegt in der Vergangenheit, Status nicht verified*. ISO 27001 Cl. 10.1 d: Wirksamkeit prüfen, sonst Major-NC.'
            action: 'Wirksamkeitsprüfungs-Leitfaden öffnen'
        audit_finding_major_nc_requires_capa:
            title: 'Major-NC verlangt CAPA'
            body: 'Major-NC verlangt nach ISO 27001 Cl. 10.1.1 eine dokumentierte Reaktion: CorrectiveAction mit dem Finding verknüpfen, dann schließen.'
            action: 'CAPA-Workflow öffnen'
        risk_acceptance_without_justification:
            title: 'Risk-Acceptance ohne Begründung'
            body: 'accept ohne acceptanceJustification ist ein häufiger ISO-27001-NC. Cl. 8.3 + 6.1.3 f: Akzeptanz begründen und gegen Risk-Appetite prüfen.'
            action: 'Acceptance-Template öffnen'
        risk_residual_exceeds_initial:
            title: 'Residual-Score (%residual%) > Initial-Score (%initial%)'
            body: 'ISO 27005 Cl. 8.4: Residualrisiko ist das Risiko NACH Behandlung, also ≤ Initial. Höherer Wert = oft vertauschte Achsen. Werte prüfen.'
            action: 'Risiko-Matrix-Leitfaden öffnen'
