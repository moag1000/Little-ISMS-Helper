        action: 'Prüf-Queue öffnen'
    no_notification_channel:
        title: 'Keine aktiven Benachrichtigungskanäle konfiguriert'
        body: 'Benachrichtigungsmodul aktiv, aber kein Kanal (E-Mail / Webhook / In-App) eingerichtet — Alerts erreichen niemanden (ISO 27001 Kl. 9.1).'
        action: 'Kanal anlegen'
    overdue_authority_report:
        title: 'EU-Behörden-Meldung überfällig'
        body: '%count% EU-Behörden-Meldepflicht(en) überfällig (DSGVO Art. 33 / NIS-2 BSIG § 33 / DORA Art. 28). Sofort melden.'
        action: 'Behörden-Hub öffnen'
    dora_roi_export_due:
        title: 'DORA RoI noch nicht eingereicht'
        body: 'Der DORA Register of Information für %year% wurde noch nicht beim zuständigen Aufseher eingereicht (DORA Art. 28). Frist: 31.12.%year%.'
        action: 'DORA RoI öffnen'
    dora_category_unset:
        title: 'DORA-Verpflichtungsstatus nicht gesetzt — Widerspruch erkannt'
        body: '%count% Lieferant(en)/Asset(s) als DORA-relevant markiert, die Organisation aber nicht DORA-pflichtig. Status in den Einstellungen prüfen.'
        action: 'Organisations-Einstellungen öffnen'
    fte_savings_milestone:
        title: 'Meilenstein: %hours% FTE-Stunden eingespart'
        body: '%minutes% Minuten (%hours% Stunden) Aufwand gespart: SSO-JIT-Provisioning, Bulk-Import und Evidence-Wiederverwendung.'
        action: 'FTE-Dashboard öffnen'
    risks_linked_to_open_incidents:
        title: 'Offene Vorfälle halten Risikodruck aufrecht — Überprüfung empfohlen'
        body: '%count% Risiko(en) seit über 30 Tagen mit offenen Vorfällen verknüpft. Vorfälle beheben, um Risikoexposition und Register aktuell zu halten.'
        action: 'Risikoregister öffnen'
    library_updated:
        title: 'Compliance-Framework-Aktualisierung verfügbar'
        body: 'Neuere Version von Framework %code% (lokal: %yaml_version%, importiert: %db_version%). Bibliothek erneut importieren.'
        action: 'Bibliothek aktualisieren'
    role_mapping_without_claim:
        title: 'IdP ohne Rollen-Mapping — Privilegienlücke'
        body: '%count% Identity-Provider mit aktiven Logins ohne Rollen-Mapping — JIT-Nutzer erhalten nur die Fallback-Rolle. Rollen-Mapping konfigurieren.'
        action: 'Rollen-Mapping konfigurieren'
    planning_due_action_items:
        title: 'Fällige Maßnahmen'
        body: '%count% Maßnahme(n) in den nächsten 14 Tagen fällig.'
        action: 'Fällige ansehen'
    mapping_concept_primer:
        title: 'Neu bei Mappings? Kurz erklärt'
        body: 'Ein Mapping verbindet zwei Frameworks: Einmal erfüllt, zählt eine Anforderung über Vererbung auch im anderen. Mehr: „Mapping-Tour starten“.'
    mapping_coverage_primer:
        title: 'Coverage-% richtig lesen'
        body: 'Coverage zeigt, wie viel eines Frameworks durch erfüllte Controls abgedeckt ist. Der Rest ist Ihre To-do-Liste (ISO 27001 Cl. 6.1.3).'
    mapping_quality_primer:
        title: 'Zwei Qualitäts-Zahlen — was bedeuten sie?'
        body: 'Confidence: wie sicher passt die Verbindung? MQS: wie gut ist sie belegt? Mappings im Status „draft“ zählen erst nach Review zur Coverage.'

