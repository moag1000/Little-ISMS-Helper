    persona_duty:
        top_management: Trägt die Gesamtverantwortung für das ISMS, billigt die Risikomanagementmaßnahmen und überwacht ihre Umsetzung (ISO 27001 5.1, NIS-2 Art. 20).
        ciso: Verantwortet die Informationssicherheitsstrategie und berichtet der Leitung über die Leistung des ISMS (ISO 27001 5.3 b).
        isb: Steuert das ISMS, stellt die Normkonformität sicher und berichtet der Leitung (ISO 27001 5.3 a, b).
        risk_manager: Führt Risikobeurteilung und -behandlung durch und bereitet die Risikoakzeptanz vor (ISO 27001 6.1.2, 8.2).
        compliance_manager: Ermittelt rechtliche, regulatorische und vertragliche Anforderungen und überwacht ihre Einhaltung (A.5.31).
        dpo: Berät und überwacht zum Datenschutz, Ansprechpartner der Aufsichtsbehörde (DSGVO Art. 39).
        bcm_officer: Plant, übt und verbessert die Notfallvorsorge und die Kontinuitätspläne (A.5.29, A.5.30, ISO 22301).
    persona_competence:
        top_management: Schulung der Leitung zum Risikomanagement in der Cybersicherheit
