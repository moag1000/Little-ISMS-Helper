            risks: 'Anwendbar, weil das Control diese Risiken behandelt: %risks%.'
            requirements: 'Gefordert von: %requirements%.'
            excluded: Nicht anwendbar, kein Risiko im Register wird durch dieses Control behandelt und keine Anforderung eines aktiven Frameworks verlangt es.
            status:
                not_started: Umsetzung noch nicht begonnen.
                planned: Umsetzung geplant.
                in_progress: Umsetzung läuft.
                implemented: Umgesetzt.
                verified: Umgesetzt und geprüft.
