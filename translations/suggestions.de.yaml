            protection_need: Abhängigkeiten (Maximumprinzip) und BIA heben den Schutzbedarf an.
        risk:
            residual: Umgesetzte und wirksame Maßnahmen senken die Eintrittswahrscheinlichkeit.
            treatment_complete: Alle Maßnahmen des Plans sind umgesetzt.
            after_incident: Ein Vorfall hat das Risiko eintreten lassen.
            from_vulnerability: Offene Schwachstelle ab CVSS 7 ohne Risiko.
