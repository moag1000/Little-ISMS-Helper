            scope_interface: Aus kritischen Lieferanten.
            role: Aus den Inhabern der Persona-Rollen.
            competence: Standard-Kompetenzen der Rollen im Rollenregister.
            opportunity: Vorschläge aus der Zeit vor dem Verbesserungsregister.
            improvement: Aus Managementbewertung, Audit-Verbesserungspotenzial und Erkenntnissen aus Vorfällen und Übungen.
            monitoring_source: Aus den genutzten Cloud-Diensten (Lieferanten mit Kennzeichen Cloud-Dienst).
        compliance:
            inheritance: Eine erfüllte Anforderung deckt eine gemappte ab.
        ai:
            risk_from_incident: Schreibt ein Risiko zu Vorfällen der letzten 90 Tage ohne verknüpftes Risiko.
            soa_justification: Schreibt eine Begründung für anwendbare Maßnahmen ohne Begründung (ISO 27001 6.1.3 d).
            corrective_action: Schreibt eine Korrekturmaßnahme zu offenen Feststellungen ohne Maßnahme (ISO 27001 10.2).
            incident_report: Schreibt den Text für die nächste offene NIS-2- oder DORA-Meldung (Art. 23 Abs. 4, Art. 19).
            breach_notification: Schreibt die leeren Teile der Meldung an die Aufsichtsbehörde (DSGVO Art. 33 Abs. 3 a, c, d).
            dsr_response: Schreibt die Antwort auf offene Betroffenenanfragen ohne Antwort (DSGVO Art. 12, 15–22).
            board_summary: Schreibt die Zusammenfassung einer Managementbewertung mit mindestens drei Eingaben (ISO 27001 9.3).
            nonconformity_statement: Macht aus Notizen zu einer Abweichung den Text für den Auditbericht (ISO 19011 6.4.8).
            questionnaire_evaluation: Wertet beantwortete Lieferantenfragebögen aus (ISO 27001 A.5.19–5.22, NIS-2 Art. 21 Abs. 2 d).
            bc_plan_from_bia: Schreibt Aktivierung, Wiederanlauf und Kommunikation für Prozesse mit BIA ohne BC-Plan (ISO 22301 8.4).
            bc_exercise_evaluation: Schreibt die leeren Teile der Auswertung einer durchgeführten BC-Übung (ISO 22301 8.5).
            legal_requirement_from_party: Macht aus dem Freitext einer interessierten Partei einen Eintrag im Register rechtlicher Anforderungen (ISO 27001 4.2 b).
            requirement_mapping: Ordnet Anforderungen aktiver Frameworks ohne Maßnahme passende eigene Maßnahmen zu. Nur nachts, ohne globale Mappings.
            vvt_from_supplier: Schreibt den VVT-Entwurf zu Lieferanten mit AVV, die noch keine Verarbeitungstätigkeit haben (DSGVO Art. 30, 28).
            evidence_fit: Beurteilt, ob die Nachweise zum Ziel der Maßnahme passen, und schreibt eine Auditnotiz als Kommentar (ISO 19011 6.4).
            audit_sample: Schlägt für geplante und laufende Audits eine Stichprobe aus Maßnahmen und Werten des Umfangs vor (ISO 19011 6.3).
            risk_acceptance_explained: Erklärt verständlich, was die beantragte Risikoakzeptanz bedeutet. Das Risiko wird nicht akzeptiert (ISO 27005 8.4.4).
            decision_rationale: Schreibt die Begründung für Entscheidungsvorschläge an die Leitung ohne Text (ISO 27001 9.3.3).
        soa:
            justification: Begründung aus den behandelten Risiken und den Anforderungen anderer Frameworks (ISO 27001 6.1.3 d).
