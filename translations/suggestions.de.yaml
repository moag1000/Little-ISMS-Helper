            recovery: Wiederanlauf
            communication: Kommunikation
        ai_bc_exercise:
            title: 'Auswertung der Übung %exercise%'
            rationale: 'Übung vom %date%. Übernommen werden nur leere Felder, Bewertung und Abschluss bleiben bei Ihnen. %reasoning%'
