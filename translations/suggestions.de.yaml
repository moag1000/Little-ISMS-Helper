            consequences: Wahrscheinliche Folgen
            measures: Ergriffene oder geplante Maßnahmen
        ai_dsr:
            title: 'Antwort auf %request%'
            rationale: '%article%, Frist bis %deadline%. Versand und Abschluss bleiben bei Ihnen. %reasoning%'
        ai_board:
            title: 'Zusammenfassung für die Leitung: %review%'
            rationale: 'Aus %inputs% Eingaben der Managementbewertung. Entscheiden bleibt bei der Leitung (9.3.3). %reasoning%'
        ai_nc:
            title: 'Abweichungstext für %finding%'
            rationale: 'Anforderung: %clause%. Ersetzt die Notizen, Nachweise nur wenn leer. %reasoning%'
