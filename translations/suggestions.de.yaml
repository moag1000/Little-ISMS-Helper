            well: Was gut lief
            lessons: Erkenntnisse
        ai_legal_req:
            title: 'Rechtliche Anforderung: %requirement%'
            rationale: 'Aus den Anforderungen von %party%. Art: %category%, Fundstelle: %reference%. Verantwortlich wird, wer annimmt. %reasoning%'
        ai_mapping:
            title: '%requirement% durch %controls% erfüllt'
            rationale: '„%title%“. Verknüpft werden nur eigene Maßnahmen, das globale Mapping bleibt unverändert. %reasoning%'
        ai_vvt:
