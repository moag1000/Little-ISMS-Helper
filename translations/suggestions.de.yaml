            external: Extern werden nur die Felder des jeweiligen Datensatzes gesendet, personenbezogene Daten standardmäßig ersetzt. Das Audit-Log protokolliert jeden Aufruf ohne Inhalt.
            human: Die KI schreibt nur Vorschläge. Übernommen wird erst, wenn eine berechtigte Person annimmt.
        test: Verbindung testen
        flash:
            saved: Gespeichert.
            endpoint_invalid: Endpunkt ungültig. Erlaubt sind http(s)-Adressen ohne Zugangsdaten, extern nur https an öffentliche Adressen.
