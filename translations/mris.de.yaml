    baselines:
        explainer:
            summary: 'Was tut eine MRIS-Baseline?'
            intro: |
                Eine MRIS-Baseline ist eine <strong>branchenspezifische Voreinstellung der Reifegrad-Ziele</strong>
                für die 13 Mythos-Härtungs-Controls (MHC-01..13). Beim Anwenden auf eine Organisation setzt sie:
            point_target: 'pro MHC einen <strong>Ziel-Reifegrad</strong> (<code>initial</code> / <code>defined</code> / <code>managed</code>) — was die Branche mindestens braucht,'
            point_reason: 'eine <strong>Begründung</strong> warum dieser Reifegrad relevant ist (Regulatorik, Risikolage, typische Bedrohungen),'
            point_preserve: '<strong>bestehende Reifegrad-Bewertungen bleiben unangetastet</strong> (<code>maturity_current</code>-Werte werden nicht überschrieben).'
            example: '<strong>Beispiel:</strong> <code>healthcare-provider</code> setzt Phishing-resistente MFA (MHC-03) auf <code>managed</code> wegen der Ransomware-Welle 2024/25, aber Multi-Tenancy (MHC-07) nur auf <code>defined</code> weil intern. Nach Anwendung siehst du im SoA + Reifegrad-Report die Lücke zwischen Ist (deine Bewertung) und Soll (Baseline-Ziel) als priorisierte Maßnahmen-Liste.'
        title: 'MRIS-Branchen-Baselines'
        intro: 'Vorkonfigurierte Soll-Stufen pro MHC, abgestimmt auf Branchen wie KRITIS / NIS2-Essential, Finance / DORA, Automotive / TISAX und SaaS / CRA. Anwenden setzt nur das Soll (<code>maturity_target</code>) — bestehende Self-Assessments (Ist) bleiben unangetastet.'
        no_tenant: 'Keine Organisation zugewiesen — Baselines benötigen einen Organisationskontext zum Anwenden.'
        empty: 'Keine Baselines verfügbar. Erwartet werden YAML-Dateien unter <code>fixtures/mris/baselines/</code>.'
        file_label: 'Datei:'
        dry_run: 'Vorschau (Dry-Run)'
        apply: 'Anwenden'
        confirm_apply: 'Baseline ''%baseline%'' wirklich auf Organisation ''%tenant%'' anwenden? Bestehende Soll-Stufen werden überschrieben.'
        tenant_required: 'Organisationskontext erforderlich.'
        manager_required: 'Anwenden erfordert Rolle Manager (ROLE_MANAGER).'
        cli_hint: 'Konsolen-Pendant für Automatisierung:'
        source_files: 'Die Baseline-Quelldateien liegen unter <code>fixtures/mris/baselines/*.yaml</code>.'
