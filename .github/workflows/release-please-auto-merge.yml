name: Release Please Auto-Merge

# Auto-merge fuer den offenen release-please-PR — laeuft wochentlich Mo 9 UTC
# (11:00 MESZ / 10:00 MEZ). Akkumulierte Commits werden in einem Stable-Release
# gebuendelt veroeffentlicht ohne manuellen Klick.
#
# Erzwingt Cadence-Disziplin: kein "Maschinengewehr-Tagging" mehr — selbst
# wenn 20 fix-/feat-Commits in der Woche landen, wird genau einmal Mo
# gemerged → genau ein Stable-Tag pro Woche.
#
# Skip-Bedingungen:
#   - Kein offener release-please-PR (keine Commits seit letztem Tag)
#   - PR hat Label "release-blocked" oder "do-not-merge"
#   - CI (per workflow_dispatch auf dem Release-Branch gestartet) ist nicht
#     gruen → kein Merge, der Job schlaegt sichtbar fehl
#
# Manueller Bypass: GitHub Actions → "Release Please Auto-Merge" → Run workflow
# (workflow_dispatch). Praktisch wenn z. B. ein dringender Bugfix sofort raus
# soll statt bis Montag zu warten.

on:
  schedule:
    # Mo 09:00 UTC = 11:00 MESZ / 10:00 MEZ
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write  # Required for `gh workflow run` (workflow_dispatch) to
                  # kick off Release Please post-merge — without this the
                  # final step fails with HTTP 403 and no tag/release is
                  # created (broke 2026-05-25 v3.8.0 release).

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Find release-please PR
        id: find_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # release-please nutzt Branch-Pattern release-please--branches--<base>--*
          # Plus PR-Title-Prefix "chore(main): release " als Backup-Filter.
          pr_number=$(gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --search 'in:title "chore(main): release"' \
            --json number,labels,headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--branches--")) | select([.labels[].name] | any(. == "release-blocked" or . == "do-not-merge") | not) | .number' \
            | head -1 || true)

          if [ -z "$pr_number" ]; then
            echo "::notice::No release-please PR open (or all blocked) — nothing to merge."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found release PR #$pr_number"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Run CI on the release PR and wait for green
        if: steps.find_pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=${{ steps.find_pr.outputs.number }}
          repo="${{ github.repository }}"
          # release-please opens the PR with GITHUB_TOKEN. Its pull_request
          # runs end as "action_required" (bot runs need approval), so the PR
          # never gets a real CI result. A workflow_dispatch from this job is
          # allowed to start CI, so run it on the release branch and merge only
          # when that run for the PR head commit concludes with success.
          # Before #1059 the old wait loop fell through to the merge on timeout
          # and #1057 went in with red checks.
          read -r branch sha < <(gh pr view "$pr" --repo "$repo" --json headRefName,headRefOid --jq '"\(.headRefName) \(.headRefOid)"')
          echo "Release PR #$pr: $branch @ $sha"
          gh workflow run ci.yml --repo "$repo" --ref "$branch"

          run_id=""
          for _ in $(seq 1 20); do
            sleep 15
            run_id=$(gh run list --repo "$repo" --workflow ci.yml --branch "$branch" --event workflow_dispatch \
              --json databaseId,headSha --jq "[.[] | select(.headSha == \"$sha\")][0].databaseId // empty")
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            echo "::error::CI run for $sha did not start — not merging."
            exit 1
          fi
          echo "Waiting for CI run $run_id"
          # Up to ~60 min; the full suite takes ~25 min.
          for _ in $(seq 1 120); do
            read -r status conclusion < <(gh run view "$run_id" --repo "$repo" --json status,conclusion --jq '"\(.status) \(.conclusion)"')
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI green."
                exit 0
              fi
              echo "::error::CI run $run_id concluded $conclusion — not merging."
              exit 1
            fi
            sleep 30
          done
          echo "::error::CI run $run_id still running after waiting — not merging."
          exit 1

      - name: Merge release-please PR
        if: steps.find_pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=${{ steps.find_pr.outputs.number }}
          # Squash-Merge wie release-please es default macht — Commit-Message
          # bleibt wie vom Tool generiert.
          gh pr merge "$pr" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch \
            --auto || gh pr merge "$pr" \
              --repo "${{ github.repository }}" \
              --squash \
              --delete-branch
          echo "::notice::PR #$pr merged."

      - name: Trigger Release Please post-merge
        if: steps.find_pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN-Pushes triggern downstream-Workflows nicht (Anti-
          # Infinite-Loop-Schutz). Heisst: der Squash-Merge-Commit oben
          # loest die "Release Please"-Action NICHT automatisch aus →
          # kein Tag, kein GitHub Release, kein Docker-Build. Workaround:
          # explizit via workflow_dispatch nachtreten.
          # Bis zu 30 sec Pause damit der Merge tatsaechlich auf main
          # ist bevor wir release-please drueberlaufen lassen.
          sleep 30
          gh workflow run "Release Please" \
            --repo "${{ github.repository }}" \
            --ref main
          echo "::notice::Release Please workflow_dispatch triggered. Tag + Release in ~1 min."
