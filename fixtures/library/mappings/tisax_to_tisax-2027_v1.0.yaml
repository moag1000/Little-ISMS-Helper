# -----------------------------------------------------------------
# VERSION CROSSWALK -- VDA-ISA 6.0 -> VDA-ISA 2027.
#
# Both catalogues are certifiable in parallel; this crosswalk supports
# tenants moving an assessment from one to the other.
#
# Relationship is deliberately 'related', NOT 'equivalent': the workbook's
# own change history shows ENX restructures and revises controls behind
# stable numbers (e.g. "restructuring of controls", "revision Maturity
# Level 2"). A shared control number therefore means "same slot in the
# catalogue", not "same requirement" — a carried-over maturity rating must
# be re-confirmed, never auto-accepted.
#
# 72 numbers shared - 6 added in 2027 - 8 dropped from ISA 6.
# -----------------------------------------------------------------
schema_version: '1.1'
library:
  type: mapping
  id: 'tisax_to_tisax-2027_v1.0'
  source_framework: 'TISAX'
  target_framework: 'TISAX-2027'
  version: 1
  effective_from: '2026-01-01'
  effective_until: null

  provenance:
    primary_source: 'Control-number comparison of the official VDA-ISA 6.0 and VDA-ISA 2027 catalogues'
    primary_source_url: 'https://enx.com/en-US/TISAX/'
    confidence: 'structural_comparison_of_official_catalogues'
    publisher: 'Little ISMS Helper Maintainers'
    extracted: '2026-08-13'

  methodology:
    type: 'machine_assisted_with_review'
    description: |
      Control numbers of both shipped catalogues were compared mechanically.
      Shared numbers are emitted as 'related' so downstream logic cannot treat
      a version change as a free pass; dropped ISA 6 controls are emitted as
      gap markers with a null target.

  lifecycle:
    state: 'published'
    state_history:
      - { state: 'published', date: '2026-08-13', actor: 'maintainer' }

  stats:
    shared_control_numbers: 72
    added_in_isa2027: 6
    dropped_from_isa6: 8

