security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User:
            algorithm: auto

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # API tokens (REST + assistant/MCP): every request with an
        # `Authorization: Bearer` header lands here, whatever its path.
        # Stateless — the token is never written into a session, so no cookie
        # can stand in for it later. The token counts only on /api and /mcp;
        # everywhere else (web UI pages and forms) the answer is 401.
        # Writes: ReadOnlyApiSubscriber (405 except /mcp) + McpWriteAccess.
        api_token:
            request_matcher: App\Security\Token\ApiTokenRequest
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            custom_authenticators:
                - App\Security\ApiTokenAuthenticator
            entry_point: App\Security\ApiTokenAuthenticator

        main:
            lazy: true
            provider: app_user_provider
            # Refuses deactivated users on every login path (form, SSO,
            # remember-me, impersonation); open sessions of a deactivated user
            # are ended by DeactivatedUserSubscriber.
            user_checker: App\Security\UserChecker

            # Form login for local users
            # Note: Symfony automatically regenerates the session on successful authentication
            # to prevent session fixation attacks (OWASP A07:2021)
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                # Use custom success handler for locale-aware redirects
                success_handler: App\Security\LoginSuccessHandler
                always_use_default_target_path: false

            # Brute-force protection for every authenticator of this firewall
            # (form login, API token, SSO). Symfony counts failed attempts per
            # username+IP (5 per 15 minutes) and per IP (25 per 15 minutes) and
            # resets on success. The check runs while the firewall verifies the
            # credentials — a limiter inside SecurityController::login() never
            # saw the POST, because form_login answers it before the controller.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            # Logout
            logout:
                path: app_logout
                target: app_login
                # Security: Invalidate session on logout (default: true)
                invalidate_session: true

            # Custom authenticators for Azure OAuth, SAML, and generic SSO (OIDC).
            # API tokens are NOT accepted here — see the api_token firewall.
            custom_authenticators:
                - App\Security\AzureOAuthAuthenticator
                - App\Security\AzureSamlAuthenticator
                - App\Security\GenericOidcAuthenticator

            # Entry point: ReauthEntryPoint renders the re-auth challenge for
            # RememberMe sessions hitting fully-authenticated routes; otherwise
            # falls back to redirecting unauthenticated users to login_path.
            entry_point: App\Security\ReauthEntryPoint

            # Remember me functionality
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 week in seconds
                path: /
                always_remember_me: false
                # Security: Use secure and httponly cookies
                # Note: secure=auto allows HTTP in dev, HTTPS in prod
                secure: auto
                httponly: true
                samesite: 'lax'

            # Allow user impersonation (for admins)
            # SwitchUserVoter: caller needs ROLE_ALLOWED_TO_SWITCH, the target no role
            # beyond the caller's and never ROLE_SUPER_ADMIN.
            switch_user: { role: CAN_SWITCH_USER }

            # Re-authentication challenge: when a RememberMe user hits a route
            # requiring IS_AUTHENTICATED_FULLY, return a modal challenge instead
            # of redirecting to /login.
            access_denied_handler: App\Security\ReauthAccessDeniedHandler

    # Role hierarchy - higher roles inherit permissions from lower roles
    role_hierarchy:
        ROLE_AUDITOR:           ROLE_USER
        ROLE_MANAGER:           [ROLE_USER, ROLE_AUDITOR]
        # Persona-Roles for dashboard gating.
        # The four persona-dashboards (CISO, Risk-Manager, Board,
        # Compliance-Manager / DPO) are gated by these roles rather than by
        # ROLE_MANAGER, so a Manager does not see every persona view. Each
        # dashboard only surfaces to its actual audience. They all inherit ROLE_MANAGER (operational read+write
        # scope) — admins assign exactly one to each user via the User-Form.
        ROLE_CISO:                  ROLE_MANAGER
        ROLE_RISK_MANAGER:          ROLE_MANAGER
        ROLE_DPO:                   ROLE_MANAGER
        ROLE_COMPLIANCE_MANAGER:    ROLE_MANAGER
        # ISB + BCM-Officer persona-roles.
        # ROLE_ISB: Informationssicherheitsbeauftragter (operational security officer).
        #   Primary user of ISMS core, controls, incidents, audits.
        #   Inherits ROLE_MANAGER — full read+write ISMS operational scope.
        ROLE_ISB:                   ROLE_MANAGER
        # ROLE_BCM_OFFICER: Business Continuity Manager (per-tenant, not Konzern).
        #   Steers BCM module: BC-Plans, Crisis-Team, BC-Exercises, Business-Processes.
        #   Inherits ROLE_MANAGER — BCM operational scope.
        ROLE_BCM_OFFICER:           ROLE_MANAGER
        # ROLE_TOP_MGMT: Leitung / Geschäftsleitung (ISO 27001 5.1, 9.3; NIS-2 Art. 20).
        #   Own persona with the board dashboard and board tour. Reads everything
        #   (inherits ROLE_AUDITOR), changes nothing operational; approvals that
        #   belong to top management check ROLE_TOP_MGMT explicitly (policy
        #   wizard bulk approval, document sections, workflow steps).
        #   ROLE_ADMIN deliberately does NOT inherit it (2026-11): the norm asks
        #   top management to approve, so the role is assigned to those people.
        ROLE_TOP_MGMT:              ROLE_AUDITOR
        ROLE_ADMIN:             [ROLE_USER, ROLE_AUDITOR, ROLE_MANAGER, ROLE_CISO, ROLE_RISK_MANAGER, ROLE_DPO, ROLE_COMPLIANCE_MANAGER, ROLE_ISB, ROLE_BCM_OFFICER]
        ROLE_SUPER_ADMIN:       [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH, ROLE_GROUP_CISO, ROLE_KONZERN_AUDITOR]
        # Holding-Rollen für Konzern-Strukturen.
        #
        # ROLE_GROUP_CISO: Konzern-ISB / Group-CISO.
        #   Lese-quer-Kapazität über alle Tochter-Tenants hinweg (Group-Dashboards,
        #   Risk-Register, SOA-Übersichten). Darf Einzel-Tenant-Configs NICHT ändern.
        #   Inherits ROLE_AUDITOR: kann alle ISMS-Dokumente und das Risk-Register lesen,
        #   aber keine Schreib-/Lösch-Operationen ausführen.
        #   Einsatz: Board-Dashboards, Group-Reports, Portfolio-Übersicht.
        ROLE_GROUP_CISO:        ROLE_AUDITOR
        # ROLE_KONZERN_AUDITOR: Read-Only auf alle Tochter-Tenants.
        #   Nur Lese-Zugriff — für externe oder interne Konzern-Auditoren, die
        #   alle Subsidiaries prüfen müssen, ohne Schreibrechte zu haben.
        #   Einsatz: Konzerninterne Audits, Regulierungs-Reviews, Portfolio-Berichte.
        ROLE_KONZERN_AUDITOR:   ROLE_AUDITOR
        # Konzern-BCM-Officer.
        #   Steuert konzernweite BCM-Standards (BCM-Auto-Create-Flow), kann
        #   Konzern-Defaults für Policies setzen (policy_wizard.konzern_defaults)
        #   und BCM-Auto-Create-Vorgaben pflegen. Inherits ROLE_MANAGER, weil
        #   der Group-BCM-Officer auch operativ in Tochter-Tenants Policies
        #   reviewt — auf Manager-Level-Scope, nicht Admin.
        ROLE_GROUP_BCM_OFFICER: ROLE_MANAGER
        # Function-Owner / Fachbereichsleiter.
        #   Per-Tenant Business-Function-Head (Risk-Owner P1, W2 wizard Step 3).
        #   Darf für Policies, deren affectedFunctions die eigene Funktion
        #   abdecken, einen Function-Owner-Review zeichnen. Erbt nur ROLE_USER:
        #   funktionale Sign-Off-Befugnis, keine Admin-/Konfig-Rechte.
        ROLE_FUNCTION_OWNER:    ROLE_USER

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # Setup wizard - access control is handled by SetupSecuritySubscriber
        # Before setup: PUBLIC_ACCESS
        # After setup: ROLE_SUPER_ADMIN required (SetupSecuritySubscriber + SetupAccessVoter)
        # IMPORTANT: Must match both /setup and /{locale}/setup/ patterns
        - { path: ^/setup, roles: PUBLIC_ACCESS }
        - { path: '^/(de|en)/setup', roles: PUBLIC_ACCESS }

        # Public routes (security routes are now WITHOUT locale prefix)
        - { path: ^/$, roles: PUBLIC_ACCESS }
        # Infra probe endpoints — unauthenticated, locale-independent (no /{_locale} prefix)
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        - { path: ^/readyz$, roles: PUBLIC_ACCESS }
        - { path: ^/metrics$, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/oauth, roles: PUBLIC_ACCESS }
        - { path: ^/saml, roles: PUBLIC_ACCESS }
        - { path: ^/sso, roles: PUBLIC_ACCESS }
        - { path: '^/(de|en)/sso/', roles: PUBLIC_ACCESS }

        # Quick-Fix fallback: must remain reachable when schema-error blocks
        # the user-table query the firewall would otherwise need. Per-request
        # access is gated by App\Service\QuickFixGuard inside the controller.
        - { path: ^/quick-fix, roles: PUBLIC_ACCESS }

        # Trust-Center — unauthenticated compliance-posture sharing.
        # Token in URL acts as bearer; controller enforces publicPostureEnabled gate.
        # No locale prefix — /trust/{token} is a stable bearer URL.
        - { path: ^/trust/, roles: PUBLIC_ACCESS }

        # MFA Challenge (NIS2 Compliance - Art. 21.2.b)
        # User is authenticated but hasn't completed MFA yet
        - { path: '^/(de|en)/mfa-challenge$', roles: IS_AUTHENTICATED_REMEMBERED }
        - { path: '^/(de|en)/mfa-verify$', roles: IS_AUTHENTICATED_REMEMBERED }

        # Re-auth endpoints (locale-prefixed — /{locale}/reauth/...)
        # IS_AUTHENTICATED_REMEMBERED: a RememberMe user must be able to reach these.
        - { path: '^/(de|en)/reauth/', roles: IS_AUTHENTICATED_REMEMBERED }

        # Defensive safeguard: Prevent locale-prefixed security routes from requiring authentication
        # These routes should NEVER exist (SecurityController is excluded from locale routing),
        # but if accidentally created, this ensures they remain public to prevent redirect loops
        - { path: '^/(de|en)/(login|logout)$', roles: PUBLIC_ACCESS }

        # Async-job status polling + shared progress page are also used by
        # non-admin dispatchers (risk / processing-activity / analytics exports).
        # Safe for ROLE_USER: AsyncJobVoter only admits the job's owner or a
        # SUPER_ADMIN, so the job id is no longer an access token.
        - { path: '^/(de|en)/admin/jobs/[0-9a-f-]{36}/(status|progress)$', roles: ROLE_USER }

        # REST API, its OpenAPI docs and JSON-LD contexts: logged-in session or
        # API token (api_token firewall, authenticated before this check). Without the
        # rule /api/docs published the whole schema to anonymous visitors.
        - { path: ^/api, roles: IS_AUTHENTICATED_REMEMBERED }

        # Assistant connection (MCP): bearer API token only — McpController
        # answers 401 itself (JSON-RPC error + WWW-Authenticate) instead of the
        # login redirect, and refuses session cookies.
        - { path: ^/mcp$, roles: PUBLIC_ACCESS }

        # Lifecycle endpoints carry no locale prefix: without this rule they sat
        # outside access_control (LifecycleController also gates class-level).
        - { path: ^/lifecycle/, roles: ROLE_USER }

        # Admin routes (with locale prefix) - specific locale pattern for better security
        - { path: '^/(de|en)/admin', roles: ROLE_ADMIN }

        # All other routes require authentication (with locale prefix) - specific locale pattern
        - { path: '^/(de|en)/', roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
