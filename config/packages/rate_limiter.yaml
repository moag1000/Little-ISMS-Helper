framework:
    rate_limiter:
        # Login brute-force protection lives in security.yaml
        # (firewall `login_throttling`), where the credential check runs.

        # Security: API rate limiting to prevent abuse
        api:
            policy: 'token_bucket'
            limit: 100
            rate: { interval: '1 minute', amount: 100 }

        # Security: failed bearer-token attempts per client IP. Counted by
        # ApiTokenAuthenticator (a failed attempt never reaches the `api`
        # limiter, the firewall answers 401 first); exhausted → 429.
        api_auth_failure:
            policy: 'sliding_window'
            limit: 20
            interval: '10 minutes'

        # Security: re-authentication (password confirm before sensitive
        # actions) — per user, so a stolen session cannot brute-force the
        # password through the reauth modal.
        reauth:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'

        # Security: public token URLs (Trust Center, supplier questionnaire)
        # — per client IP, so a link cannot be hammered or flooded with
        # questionnaire submissions.
        public_token:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'

        # Security: Document upload rate limiting
        document_upload:
            policy: 'sliding_window'
            limit: 20
            interval: '1 hour'

        # Security: MFA verification rate limiting — throttle brute-forcing of
        # TOTP / backup codes (replaces a naive 2-second per-token guard).
        mfa_verify:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'

when@test:
    framework:
        rate_limiter:
            # The suite makes many failed token attempts from 127.0.0.1;
            # the throttle itself is tested with its own limiter
            # (tests/Security/ApiTokenFailureThrottleTest).
            api_auth_failure:
                policy: 'sliding_window'
                limit: 100000
                interval: '10 minutes'
