# Note: SecurityController is NOT excluded below, so login/logout/OAuth/SAML
# routes are served with the locale prefix (/{_locale}/login, /{_locale}/saml/acs).
# IdP registrations (SAML ACS, OAuth redirect URIs) rely on these URLs — do not
# move them without updating every identity-provider configuration.

# App routes WITH locale prefix
app_routes:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute
    prefix: /{_locale}
    requirements:
        _locale: de|en
    defaults:
        _locale: de
    exclude:
        - '../src/Controller/HomeController.php'
        - '../src/Controller/QuickFixController.php'
        - '../src/Controller/QuickFixJobStatusController.php'
        - '../src/Controller/SsoController.php'
        - '../src/Controller/LifecycleController.php'
        - '../src/Controller/GlossaryApiController.php'
        - '../src/Controller/HealthController.php'
        - '../src/Controller/ReadinessController.php'
        - '../src/Controller/MetricsController.php'
        - '../src/Controller/PublicPostureController.php'
        - '../src/Controller/PublicSupplierQuestionnaireController.php'

# NOTE on ordering: the `exclude` list of app_routes is not honoured by the
# path+namespace (PSR-4 directory) loader, so every controller is also loaded
# with the /{_locale} prefix. The single-file imports below are declared AFTER
# app_routes so their un-prefixed registration replaces that duplicate by route
# name (same mechanism as sso_routes further down). Keep them after app_routes.

# Quick-Fix fallback routes WITHOUT locale prefix — must remain reachable when
# the schema-error that brought the user here also broke the locale resolver.
# QuickFixJobStatusController: public job-status polling + PRG progress page for
# QuickFix async jobs, gated by QuickFixGuard (no auth) so the emergency-recovery
# UI works while the app boot is still degraded. Routes are #[Route] attributes;
# both controllers are listed in app_routes' exclude.
quick_fix_routes:
    resource: ../src/Controller/QuickFixController.php
    type: attribute

quick_fix_job_status_routes:
    resource: ../src/Controller/QuickFixJobStatusController.php
    type: attribute

# Root redirect (smart locale detection, no prefix) + dashboard routes that carry
# their own /{_locale} segment in the #[Route] attributes of HomeController.
home_routes:
    resource: ../src/Controller/HomeController.php
    type: attribute

# Glossary API WITHOUT locale prefix — the fa-glossary-tooltip component fetches
# /api/glossary/{acronym} directly; UI locale is passed as ?locale.
glossary_api_routes:
    resource: ../src/Controller/GlossaryApiController.php
    type: attribute

# Lifecycle API routes WITHOUT locale prefix — machine-to-machine JSON endpoints;
# locale prefix would break client URLs and is unnecessary for API-style routes.
lifecycle_routes:
    resource: ../src/Controller/LifecycleController.php
    type: attribute

# SSO public routes WITHOUT locale prefix — must be declared AFTER app_routes so
# this registration wins over the locale-prefixed duplicate from the directory scan.
# IdP redirect URIs must be fixed strings; OAuth exact-match at Entra ID / Okta /
# Google / Auth0 rejects locale-prefixed callback URIs.
# Note: use string resource (AttributeFileLoader), NOT {path+namespace} array
# (Psr4DirectoryLoader only handles directories and silently returns an empty
# RouteCollection for single-file resources).
sso_routes:
    resource: ../src/Controller/SsoController.php
    type: attribute

# Infra probe routes WITHOUT locale prefix — orchestrators (k8s, Compose --wait,
# load-balancers, Prometheus scrapers) call fixed paths. Locale prefix is
# intentionally omitted: these are machine-to-machine endpoints, not user-facing.
infra_probe_routes:
    resource: ../src/Controller/ReadinessController.php
    type: attribute

infra_health_routes:
    resource: ../src/Controller/HealthController.php
    type: attribute

infra_metrics_routes:
    resource: ../src/Controller/MetricsController.php
    type: attribute

# F43 Trust-Center public posture routes WITHOUT locale prefix.
# /trust/{token} is a stable bearer-URL shared with external parties;
# a locale prefix would change the URL on every locale-switch and invalidate
# previously shared links. Token = access control — no auth required.
# Must be declared AFTER app_routes so this registration wins over the
# locale-prefixed duplicate from the directory scan (PublicPostureController
# is also excluded from app_routes above).
public_posture_routes:
    resource: ../src/Controller/PublicPostureController.php
    type: attribute

# F23 public supplier-questionnaire portal WITHOUT locale prefix.
# /supplier-questionnaire/{token} is a stable bearer-URL emailed to a supplier;
# a locale prefix would change the URL on every locale-switch and invalidate
# previously shared links. Token = access control — no auth required.
public_supplier_questionnaire_routes:
    resource: ../src/Controller/PublicSupplierQuestionnaireController.php
    type: attribute
