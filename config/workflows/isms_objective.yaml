framework:
    workflows:
        isms_objective_lifecycle:
            type: state_machine
            marking_store:
                type: method
                property: status
            supports:
                - App\Entity\ISMSObjective
            initial_marking: not_started
            places:
                - { name: not_started, metadata: { tone: neutral } }
                - { name: in_progress, metadata: { tone: primary } }
                - { name: achieved, metadata: { tone: success, end_state: true } }
                - { name: delayed, metadata: { tone: warning } }
                - { name: cancelled, metadata: { tone: neutral } }
            transitions:
                start:
                    from: not_started
                    to: in_progress
                    metadata:
                        roles: [ROLE_USER, ROLE_MANAGER]
                        tone_target: info
                # S15: recording an objective as achieved is the measured result ISO 6.2/9.3
                # reviews — a manager or the objective's responsible person (LifecycleVoter
                # `responsible`), not every signed-in user.
                achieve:
                    from: in_progress
                    to: achieved
                    metadata:
                        roles: [ROLE_MANAGER]
                        responsible: true
                        reason_required: false
                mark_delayed:
                    from: in_progress
                    to: delayed
                    metadata:
                        roles: [ROLE_MANAGER]
                        reason_required: true
                cancel:
                    from: [not_started, in_progress, delayed]
                    to: cancelled
                    metadata:
                        roles: [ROLE_MANAGER]
                        reason_required: true
                reopen:
                    from: delayed
                    to: in_progress
                    metadata:
                        roles: [ROLE_MANAGER]
                        reason_required: true
