framework:
    workflows:
        management_review_lifecycle:
            type: state_machine
            marking_store:
                type: method
                property: status
            supports:
                - App\Entity\ManagementReview
            initial_marking: planned
            places:
                - { name: planned, metadata: { tone: primary } }
                - { name: completed, metadata: { tone: success, end_state: true } }
                - { name: follow_up_required, metadata: { tone: warning, end_state: true } }
            transitions:
                # Top management reviews the ISMS (ISO 27001 9.3.1) — completing
                # the review is its decision on the results (9.3.3), recorded as
                # a ManagementDecision by ManagementReviewCompletedListener.
                # The decision itself is the second pair of eyes; the CISO
                # prepares the inputs.
                complete:
                    from: planned
                    to: completed
                    metadata:
                        roles: [ROLE_TOP_MGMT]
                mark_follow_up_required:
                    from: completed
                    to: follow_up_required
                    metadata:
                        roles: [ROLE_CISO, ROLE_MANAGER]
                        reason_required: true
                close_follow_up:
                    from: follow_up_required
                    to: completed
                    metadata:
                        roles: [ROLE_CISO, ROLE_MANAGER]
                        reason_required: true
