framework:
    workflows:
        consent_lifecycle:
            type: state_machine
            marking_store:
                type: method
                property: status
            supports:
                - App\Entity\Consent
            initial_marking: pending_verification
            places:
                - { name: pending_verification, metadata: { tone: warning } }
                - { name: active, metadata: { tone: success, end_state: true } }
                - { name: revoked, metadata: { tone: danger, end_state: true } }
                - { name: expired, metadata: { tone: danger, end_state: true } }
                - { name: rejected, metadata: { tone: danger, end_state: true } }
            transitions:
                verify:
                    from: pending_verification
                    to: active
                    metadata:
                        roles: [ROLE_DPO]
                        module: privacy
                reject:
                    from: pending_verification
                    to: rejected
                    metadata:
                        roles: [ROLE_DPO]
                        module: privacy
                        reason_required: true
                revoke:
                    from: active
                    to: revoked
                    metadata:
                        roles: [ROLE_DPO, ROLE_MANAGER]
                        module: privacy
                        reason_required: true
                expire:
                    from: active
                    to: expired
                    metadata:
                        roles: [ROLE_DPO, ROLE_MANAGER]
                        module: privacy
