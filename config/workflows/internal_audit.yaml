framework:
    workflows:
        internal_audit_lifecycle:
            type: state_machine
            marking_store:
                type: method
                property: status
            supports:
                - App\Entity\InternalAudit
            initial_marking: planned
            places:
                - { name: planned, metadata: { tone: primary } }
                - { name: in_progress, metadata: { tone: primary } }
                - { name: reported, metadata: { tone: warning } }
                - { name: approved, metadata: { tone: success } }
                - { name: rejected, metadata: { tone: danger } }
                - { name: closed, metadata: { tone: neutral } }
                # legacy buckets — accepted as places to satisfy entity LIFECYCLE_STAGES;
                # no transitions wired (read-only legacy data)
                - { name: conducted, metadata: { tone: primary } }
                - { name: completed, metadata: { tone: success } }
                - { name: postponed, metadata: { tone: warning } }
                - { name: cancelled, metadata: { tone: neutral } }
            transitions:
                start:
                    from: planned
                    to: in_progress
                    metadata:
                        roles: [ROLE_AUDITOR]
                report:
                    from: [in_progress, conducted]
                    to: reported
                    metadata:
                        roles: [ROLE_AUDITOR]
                approve:
                    from: reported
                    to: approved
                    metadata:
                        roles: [ROLE_CISO]
                        four_eyes: true
                reject:
                    from: reported
                    to: rejected
                    metadata:
                        roles: [ROLE_CISO]
                        reason_required: true
                close:
                    from: approved
                    to: closed
                    metadata:
                        roles: [ROLE_CISO]
                rework:
                    from: rejected
                    to: reported
                    metadata:
                        roles: [ROLE_AUDITOR]
