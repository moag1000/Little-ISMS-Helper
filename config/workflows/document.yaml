framework:
    workflows:
        document_lifecycle:
            type: state_machine
            marking_store:
                type: method
                property: status
            supports:
                - App\Entity\Document
            initial_marking: draft
            places:
                - { name: draft, metadata: { tone: neutral } }
                - { name: in_review, metadata: { tone: primary } }
                - { name: approved, metadata: { tone: success, end_state: true } }
                - { name: published, metadata: { tone: success, end_state: true } }
                - { name: archived, metadata: { tone: neutral, end_state: true } }
                - { name: deleted, metadata: { tone: neutral, end_state: true } }
            transitions:
                submit_for_review:
                    from: draft
                    to: in_review
                    metadata:
                        roles: [ROLE_USER, ROLE_MANAGER]
                        tone_target: info
                approve:
                    from: in_review
                    to: approved
                    metadata:
                        roles: [ROLE_MANAGER]
                        reason_required: false
                request_changes:
                    from: in_review
                    to: draft
                    metadata:
                        roles: [ROLE_MANAGER]
                        reason_required: true
                publish:
                    from: approved
                    to: published
                    metadata:
                        roles: [ROLE_MANAGER]
                        four_eyes: true
                        module: documents
                archive:
                    from: published
                    to: archived
                    metadata:
                        roles: [ROLE_MANAGER]
                        reason_required: true
                # S29 (F10): back to published only with the second person, as publish —
                # an archived or superseded policy does not return without re-approval.
                restore:
                    from: archived
                    to: published
                    metadata:
                        roles: [ROLE_MANAGER]
                        reason_required: true
                        four_eyes: true
                # X.6: policy supersession — archive the current (approved or published) doc
                # when a previous version is restored. Reason required for audit trail.
                archive_on_supersession:
                    from: [draft, in_review, approved, published, archived]
                    to: archived
                    metadata:
                        roles: [ROLE_MANAGER, ROLE_CISO]
                        reason_required: true
                # X.6: restore archived policy doc back to approved state (not published).
                # Used by PolicyDiffController::restorePrevious when supersession is undone.
                # Scope removal (e.g. the organisation is no longer a GDPR
                # subject): the document leaves the register from any live
                # place and stays as historical evidence.
                archive_out_of_scope:
                    from: [draft, in_review, approved, published]
                    to: archived
                    metadata:
                        roles: [ROLE_MANAGER, ROLE_CISO]
                        reason_required: true
                restore_to_approved:
                    from: archived
                    to: approved
                    metadata:
                        roles: [ROLE_MANAGER, ROLE_CISO]
                        reason_required: true
                # X.6: soft-delete terminal state — ADMIN only, reason required, irreversible.
                # Replaces direct setStatus('deleted') in DocumentController::delete().
                soft_delete:
                    from: [draft, in_review, approved, published, archived]
                    to: deleted
                    metadata:
                        roles: [ROLE_ADMIN]
                        reason_required: true
