# The asset owner is a relation on the record (Asset.ownerUser), not a role;
# a ROLE_ASSET_OWNER entry here never matched anybody. Owner-based permission
# comes with the responsibility resolver (norm-coverage package 2).
framework:
    workflows:
        asset_lifecycle:
            type: state_machine
            marking_store:
                type: method
                property: status
            supports:
                - App\Entity\Asset
            initial_marking: draft
            places:
                - { name: draft, metadata: { tone: neutral } }
                - { name: active, metadata: { tone: success } }
                - { name: inactive, metadata: { tone: neutral } }
                - { name: in_use, metadata: { tone: success } }
                - { name: returned, metadata: { tone: neutral } }
                - { name: retired, metadata: { tone: neutral } }
                - { name: disposed, metadata: { tone: neutral } }
            transitions:
                activate:
                    from: draft
                    to: active
                    metadata:
                        roles: [ROLE_MANAGER]
                        module: assets
                deactivate:
                    from: active
                    to: inactive
                    metadata:
                        roles: [ROLE_MANAGER]
                        reason_required: true
                reactivate:
                    from: inactive
                    to: active
                    metadata:
                        roles: [ROLE_MANAGER]
                assign_to_person:
                    from: active
                    to: in_use
                    metadata:
                        roles: [ROLE_MANAGER]
                return_from_person:
                    from: in_use
                    to: returned
                    metadata:
                        roles: [ROLE_MANAGER]
                restore_to_active:
                    from: returned
                    to: active
                    metadata:
                        roles: [ROLE_MANAGER]
                retire_from_active:
                    from: active
                    to: retired
                    metadata:
                        roles: [ROLE_MANAGER]
                        reason_required: true
                retire_from_inactive:
                    from: inactive
                    to: retired
                    metadata:
                        roles: [ROLE_MANAGER]
                        reason_required: true
                dispose:
                    from: retired
                    to: disposed
                    metadata:
                        roles: [ROLE_MANAGER]
                        four_eyes: true
                        reason_required: true
