framework:
    workflows:
        data_breach_lifecycle:
            type: state_machine
            marking_store:
                type: method
                property: status
            supports:
                - App\Entity\DataBreach
            initial_marking: draft
            places:
                - { name: draft, metadata: { tone: neutral } }
                - { name: under_assessment, metadata: { tone: primary } }
                - { name: authority_notified, metadata: { tone: success, end_state: true } }
                - { name: subjects_notified, metadata: { tone: success, end_state: true } }
                - { name: closed, metadata: { tone: neutral, end_state: true } }
            transitions:
                assess:
                    from: draft
                    to: under_assessment
                    metadata:
                        roles: [ROLE_DPO]
                        # S21: the responsible person acts too — the controller opens the step to
                        # MANAGER_OR_RESPONSIBLE and the deadline reminder goes to them.
                        responsible: true
                notify_authority:
                    from: under_assessment
                    to: authority_notified
                    metadata:
                        roles: [ROLE_DPO, ROLE_CISO]
                        # S21: the responsible person acts too — the controller opens the step to
                        # MANAGER_OR_RESPONSIBLE and the deadline reminder goes to them.
                        responsible: true
                        four_eyes: true
                        module: privacy
                        reason_required: true
                notify_subjects:
                    from: authority_notified
                    to: subjects_notified
                    metadata:
                        roles: [ROLE_DPO]
                        # S21: the responsible person acts too — the controller opens the step to
                        # MANAGER_OR_RESPONSIBLE and the deadline reminder goes to them.
                        responsible: true
                        module: privacy
                close:
                    from: [authority_notified, subjects_notified]
                    to: closed
                    metadata:
                        roles: [ROLE_DPO]
                        # S21: the responsible person acts too — the controller opens the step to
                        # MANAGER_OR_RESPONSIBLE and the deadline reminder goes to them.
                        responsible: true
                reopen:
                    from: closed
                    to: under_assessment
                    metadata:
                        roles: [ROLE_DPO]
                        reason_required: true
