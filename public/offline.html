<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Little ISMS Helper</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/offline.css">
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.48L18.18 13.8 23.64 7zM17.04 15.22L3.27 1.44 2 2.72l2.05 2.06C1.91 5.76.59 6.82.36 7l11.63 14.49.01.01.01-.01 3.9-4.86 3.32 3.32 1.27-1.27-3.46-3.46z"/>
            </svg>
        </div>

        <h1>Sie sind offline</h1>
        <p>
            Es besteht keine Internetverbindung. Bitte überprüfen Sie Ihre
            Netzwerkeinstellungen und versuchen Sie es erneut.
        </p>

        <button type="button" class="btn" id="offlineRetry">
            Erneut versuchen
        </button>

        <div class="status-indicator">
            <span class="status-dot"></span>
            <span>Keine Verbindung</span>
        </div>

        <div class="cached-pages" id="cachedPages" hidden>
            <h3>Verfügbare Seiten (gecacht)</h3>
            <ul id="cachedPagesList"></ul>
        </div>
    </div>

    <script src="/offline.js" defer></script>
</body>
</html>
