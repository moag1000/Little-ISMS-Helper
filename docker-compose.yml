services:
  # MariaDB — the application runs on MySQL 8 / MariaDB 10.6+ only (migrations use MySQL DDL)
  db:
    image: mariadb:11.4
    container_name: isms-db
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: ${DB_NAME:-isms}
      MARIADB_USER: ${DB_USER:-isms}
      MARIADB_PASSWORD: ${DB_PASSWORD:-isms_password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-isms_root_password}
    ports:
      # ✅ Security: Port nur auf localhost verfügbar
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - isms-network
    # Security: Resource Limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Little ISMS Helper Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: isms-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "${APP_PORT:-8000}:80"
      - "${APP_PORT_HTTPS:-8443}:443"
    volumes:
      # Named volumes for cache and logs
      - var_cache:/var/www/html/var/cache
      - var_log:/var/www/html/var/log
    environment:
      # Note: APP_SECRET und DATABASE_URL werden vom Deployment Wizard konfiguriert
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      # External-DB mode — skip embedded MariaDB bootstrap in init-mysql.sh
      EMBEDDED_DB: none
      DATABASE_URL: "mysql://${DB_USER:-isms}:${DB_PASSWORD:-isms_password}@db:3306/${DB_NAME:-isms}?serverVersion=mariadb-11.4.0&charset=utf8mb4"
      # MailHog für Email-Testing
      MAILER_DSN: smtp://mailhog:1025
    networks:
      - isms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    # Security: Resource Limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MailHog - Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: isms-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025"  # SMTP port
      - "127.0.0.1:${MAILHOG_WEB_PORT:-8025}:8025"   # Web UI port
    networks:
      - isms-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025/api/v1/events"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Security: Resource Limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # ✅ Alle Volumes sind persistent - überleben docker-compose down und Reboot!
  db_data:
    driver: local
  var_cache:
    driver: local
  var_log:
    driver: local

networks:
  isms-network:
    driver: bridge
